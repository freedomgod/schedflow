[build-system]
requires = [
    "setuptools >= 64",
    "setuptools_scm >= 6.4"
]
build-backend = "setuptools.build_meta"

[project]
name = "schedflow"
description = "A lightweight DAG workflow scheduling framework with triggers, executors, job stores, events and a REST API."
readme = "README.md"
authors = [
    { name = "freedomgod", email = "wwhfree@foxmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["scheduling", "cron", "workflow", "dag", "orchestration"]
license = "MIT"
requires-python = ">= 3.11"
dependencies = [
    "tzlocal >= 3.0",
    "backports.zoneinfo; python_version < '3.9'",
    "pydantic >= 2.11,<3.0",
    "typeid-python == 0.3.2",
    "networkx == 3.5",
    "tenacity >= 9.0.0",
    "structlog>=25.4.0",
    "pydantic-settings >= 2.0",
]
dynamic = ["version"]


[project.optional-dependencies]
mongodb = ["pymongo >= 3.0"]
redis = ["redis >= 3.0"]
sqlalchemy = ["sqlalchemy >= 1.4"]
tornado = ["tornado >= 6.0"]
twisted = ["twisted"]
gevent = ["gevent"]
web = [
    "fastapi == 0.136.1",
    "uvicorn[standard] == 0.46.0",
    "passlib[bcrypt] >= 1.7",
    "PyJWT >= 2.8",
]
test = [
    "schedflow[mongodb,redis,sqlalchemy,tornado,web]",
    "pytest",
    "pytest-timeout",
    "anyio >= 4.5.2",
    "gevent; python_version < '3.14'",
    "pytz",
    "twisted; python_version < '3.14'",
    "pytest-asyncio",
    "pytest-twisted >= 1.3.0",
    "psutil",
    "httpx",
]

doc = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-static-i18n>=1.2",
    "ruff",
    # Optional runtime dependencies are documented in the API reference;
    # include them so `mkdocs build` can import every documented module.
    "schedflow[web,sqlalchemy,redis,mongodb]",
]

[project.scripts]
schedflow-backend = "schedflow.cli:backend"
schedflow-frontend = "schedflow.cli:frontend"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "dirty-tag"
fallback_version = "1.0.0"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = ["-rsx", "--tb=long", "--color=yes"]
testpaths = "tests"
filterwarnings = [
    # Third-party noise — not actionable for this project
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::UserWarning:pytest_tornado.*",
    "ignore::pytest.PytestDeprecationWarning:pytest_tornado.*",
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "external_service: marks tests as requiring some external service",
]

[tool.coverage.run]
source = ["schedflow"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
extend-select = [
    "G",            # flake8-logging-format
    "I",            # isort
    "ISC",          # flake8-implicit-str-concat
    "PGH",          # pygrep-hooks
    "RUF",          # ruff specific rules
    "UP",           # pyupgrade
    "W",            # pycodestyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["schedflow"]

[tool.tox]
env_list = ["py38", "py39", "py310", "py311", "py312", "py313", "py314", "pypy3"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
commands = [["pytest", { replace = "posargs", extend = true }]]
package = "editable"
extras = ["test"]


