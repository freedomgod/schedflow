site_name: SchedFlow
site_url: https://schedflow.readthedocs.io/zh-cn/latest/
site_description: A lightweight DAG workflow scheduling framework — scheduled jobs run as Directed Acyclic Graph workflows
site_author: SchedFlow Contributors
repo_url: https://github.com/freedomgod/schedflow
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 SchedFlow Contributors

exclude_docs: |
  superpowers/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          import:
            - https://docs.python.org/3/objects.inv
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            members_order: source
            filters:
              - "!^_"
              - "^__init__$"
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          build: true
        - locale: zh
          name: 中文
          default: true
          build: true
          nav_translations:
            Home: 首页
            Getting Started: 入门指南
            Introduction: 介绍
            Installation: 安装
            Quickstart: 快速开始
            User Guide: 用户指南
            Core Features: 核心功能
            Advanced Usage: 高级用法
            DAG Workflow: DAG工作流
            API Reference: API参考
            Project: 项目
            Changelog: 更新日志
            Contributing: 贡献指南
            FAQ: 常见问题
            License: 许可证
hooks:
  - hooks.py
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Getting Started:
      - Introduction: introduction.md
      - Installation: installation.md
      - Quickstart: quickstart.md
  - User Guide:
      - Core Features: user-guide/core-features.md
      - Advanced Usage: user-guide/advanced-usage.md
      - DAG Workflow: user-guide/dag-workflow.md
  - API Reference: api-reference/index.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - FAQ: faq.md
      - License: license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/freedomgod/schedflow
